name: VirusTotal

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  virustotal:
    runs-on: ubuntu-latest
    steps:
      - name: VirusTotal Scan
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release: true
          release_heading: '**VirusTotal Results:**'
