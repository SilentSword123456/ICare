name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      - name: Sign
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ICare" -CertStoreLocation Cert:\CurrentUser\My
          Set-AuthenticodeSignature -FilePath publish/ICare.exe -Certificate $cert

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ICare.exe

  velopack:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (unpacked)
        run: >
          dotnet publish -c Release
          -r win-x64
          --self-contained true
          --output publish-vpk

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        run: >
          vpk pack
          -u ICare
          -v ${{ steps.get-version.outputs.version }}
          -p publish-vpk
          -e ICare.exe
          -i Assets/eye.ico

      - name: Upload to GitHub Release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --merge
          --releaseName "ICare ${{ steps.get-version.outputs.version }}"
          --tag ${{ github.ref_name }}
          --token ${{ secrets.GITHUB_TOKEN }}
